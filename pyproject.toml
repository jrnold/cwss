[project]
name = "cwss"
version = "0.1.0"
description = "Civil War Soldiers and Sailors database from the National Park Service: tools to convert and archive it."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dvc[gs]>=3.67.1",
    "duckdb>=1.1",
    "sqlalchemy>=2.1.6",
    "pymssql>=2.4.6",
]

[project.scripts]
cwss-zenodo-upload = "cwss.zenodo:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cwss"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
